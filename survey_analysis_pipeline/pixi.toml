[project]
name = "survey-analysis-pipeline"
version = "0.1.0"
description = "Survey analysis pipeline with LLM integration for report generation"
authors = ["Survey Analysis Team"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tasks]
analyze = "python -m survey_analysis_pipeline.main"
test = "pytest tests/"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
# LLM Integration
litellm = ">=1.40"
openai = ">=1.0"
boto3 = ">=1.34"

# Data Processing
pandas = ">=2.0"
numpy = ">=1.26"

# NLP & Embeddings
sentence-transformers = ">=2.2"
fugashi = ">=1.3"
unidic-lite = ">=1.0"

# Analysis
scikit-learn = ">=1.3"
hdbscan = ">=0.8"
umap-learn = ">=0.5"

# Vector Store
chromadb = ">=0.4"

# Visualization
matplotlib = ">=3.8"
seaborn = ">=0.13"
plotly = ">=5.18"
wordcloud = ">=1.9"

# CLI
typer = ">=0.12"
rich = ">=13.0"

# Configuration
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
python-dotenv = ">=1.0"

# Templates
jinja2 = ">=3.1"

# Utilities
tqdm = ">=4.66"
diskcache = ">=5.6"
pyyaml = ">=6.0"

[feature.dev.pypi-dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[environments]
dev = ["dev"]

